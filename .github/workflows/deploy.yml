name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "dashboard/**"
      - "public/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Build dashboard config
        env:
          API_BASE: ${{ vars.DASHBOARD_API_BASE }}
          GOOGLE_CLIENT_ID: ${{ vars.DASHBOARD_GOOGLE_CLIENT_ID }}
        run: |
          cat > dashboard/config.js <<EOF
          window.API_BASE = "$API_BASE";
          window.GOOGLE_CLIENT_ID = "$GOOGLE_CLIENT_ID";
          EOF

      - name: Deploy dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: expense-tracker-dashboard
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=master \
            || echo "Project already exists (or create skipped) — continuing."
          npx --yes wrangler@4 pages deploy dashboard --project-name="$PROJECT" --branch=master
